<!DOCTYPE html>
<html lang="es">
<head>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Fredoka & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Card Flip Animation Styling */
        .card-perspective {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-container.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
        }

        /* Front of card (Hidden content, showing letter I pattern) */
        .card-front {
            background: linear-gradient(135deg, #0288d1 0%, #03a9f4 100%);
            border: 4px solid #ffffff;
            box-shadow: 0 8px 15px rgba(2, 136, 209, 0.3);
        }

        /* Back of card (Revealed item) */
        .card-back {
            background-color: #ffffff;
            transform: rotateY(180deg);
            border: 4px solid #4fc3f7;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* Matched card highlight pulse */
        .card-container.matched {
            animation: pulse-success 0.6s ease-in-out forwards;
        }

        @keyframes pulse-success {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .card-container.matched .card-back {
            border-color: #4caf50;
            background-color: #f1f8e9;
        }

        /* Bouncing header letter */
        @keyframes float-bounce {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .bounce-letter {
            animation: float-bounce 3s ease-in-out infinite;
        }

        /* Custom scrollbar for small devices if needed */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #0288d1;
            border-radius: 10px;
        }
    </style>
</head>

        // Audio Synthesizer Class using Web Audio API (No external sound files required)
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playFlip() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playMatch() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }

            playMismatch() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(140, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playVictory() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const melody = [
                    { f: 523.25, d: 0.15 },
                    { f: 659.25, d: 0.15 },
                    { f: 783.99, d: 0.15 },
                    { f: 1046.50, d: 0.4 }
                ];
                let time = now;
                melody.forEach(note => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.f, time);
                    gain.gain.setValueAtTime(0.25, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + note.d);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(time);
                    osc.stop(time + note.d);
                    time += note.d;
                });
            }
        }

        const soundFX = new SoundEffects();

        // Web Speech API for Spanish voice pronunciation
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancel any ongoing speech
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'es-ES'; // Spanish
                utterance.rate = 0.85; // Slightly slower speed for young learners
                utterance.pitch = 1.1; // Cheerful friendly pitch
                window.speechSynthesis.speak(utterance);
            }
        }

        let cardsArray = [];

        // DOM Element References
        const gameGrid = document.getElementById('game-grid');

        const movesCountEl = document.getElementById('moves-count');
        const timerEl = document.getElementById('timer');
        const btnRestart = document.getElementById('btn-restart');
        const btnShare = document.getElementById('btn-share');
        const btnSound = document.getElementById('btn-sound');
        const soundIcon = document.getElementById('sound-icon');
        const victoryModal = document.getElementById('victory-modal');
        const modalContent = document.getElementById('modal-content');
        const finalMovesEl = document.getElementById('final-moves');
        const finalTimeEl = document.getElementById('final-time');
        const btnModalRestart = document.getElementById('btn-modal-restart');
        const btnModalShare = document.getElementById('btn-modal-share');

        // Fisher-Yates Shuffle Algorithm
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize / Reset Game State
        function initGame() {
            // Stop existing timer
            clearInterval(timerInterval);
            secondsElapsed = 0;
            gameStarted = false;
            timerEl.textContent = '00:00';

            // Reset stats
            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            lockBoard = false;
            pairsCountEl.textContent = '0 / 5';
            movesCountEl.textContent = '0';

            // Hide modal if open
            victoryModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-90');

            // Duplicate 5 items to make 10 cards (5 pairs)
            const deck = [...VOCAL_I_ITEMS, ...VOCAL_I_ITEMS];
            cardsArray = shuffle(deck);

            // Render game board cards
            renderBoard();
        }

        // Render Cards into HTML Grid
        function renderBoard() {
            gameGrid.innerHTML = '';
            cardsArray.forEach((item, index) => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container card-perspective h-32 sm:h-40 md:h-44 cursor-pointer';
                cardContainer.dataset.index = index;
                cardContainer.dataset.id = item.id;
                cardContainer.dataset.name = item.name;

                cardContainer.innerHTML = `
                    <div class="card-inner">
                        <!-- Card Front (Pattern/Cover) -->
                        <div class="card-front flex flex-col items-center justify-center p-2 text-white">
                            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/20 flex items-center justify-center border-2 border-white/50">
                                <span class="text-2xl sm:text-3xl font-extrabold text-white">i</span>
                            </div>
                            <div class="flex gap-1 mt-2 opacity-60">
                                <i class="fa-solid fa-star text-xs"></i>
                                <i class="fa-solid fa-star text-xs"></i>
                                <i class="fa-solid fa-star text-xs"></i>
                            </div>
                        </div>

                        <!-- Card Back (Illustration + Word) -->
                        <div class="card-back flex flex-col items-center justify-between p-2 sm:p-3 text-slate-800">
                            <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 flex items-center justify-center">
                                ${item.svg}
                            </div>
                            <span class="font-extrabold text-xs sm:text-sm tracking-wide text-cyan-800 bg-cyan-100 px-2 py-0.5 rounded-full border border-cyan-200">
                                ${item.name}
                            </span>
                        </div>
                    </div>
                `;

                cardContainer.addEventListener('click', () => handleCardClick(cardContainer));
                gameGrid.appendChild(cardContainer);
            });
        }

        // Timer Handler
        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // Card Click Handler
        function handleCardClick(card) {
            if (lockBoard) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            // Start timer on first card click
            startTimer();

            // Sound effect & visual flip
            soundFX.playFlip();
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesCountEl.textContent = moves;
                checkMatch();
            }
        }

        // Check if two flipped cards match
        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                // Match Found!
                setTimeout(() => {
                    soundFX.playMatch();
                    card1.classList.add('matched');
                    card2.classList.add('matched');

                    // Pronounce Spanish word aloud
                    speakWord(card1.dataset.name);

                    matchedPairs++;
                    pairsCountEl.textContent = `${matchedPairs} / 5`;

                    flippedCards = [];
                    lockBoard = false;

                    // Check for Game Victory
                    if (matchedPairs === 5) {
                        handleVictory();
                    }
                }, 400);
            } else {
                // Mismatch
                setTimeout(() => {
                    soundFX.playMismatch();
                }, 400);

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1200);
            }
        }

        // Handle Victory Modal & Celebrations
        function handleVictory() {
            clearInterval(timerInterval);
            soundFX.playVictory();

            // Trigger victory confetti burst
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Populate Modal
            finalMovesEl.textContent = moves;
            finalTimeEl.textContent = timerEl.textContent;

            // Display Modal with animation
            setTimeout(() => {
                victoryModal.classList.remove('opacity-0', 'pointer-events-none');
                modalContent.classList.remove('scale-90');
                modalContent.classList.add('scale-100');
            }, 600);
        }

        // Toast Notification System
        function showToast(message, iconClass = 'fa-check') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;
            toastIcon.className = `fa-solid ${iconClass} text-green-400 text-lg`;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 2500);
        }

        // Copy Share Link Feature
        function copyShareLink() {
            const currentUrl = window.location.href;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(currentUrl).then(() => {
                    showToast('¡Enlace copiado! Listo para compartir con tus alumnos.');
                }).catch(() => {
                    fallbackCopyTextToClipboard(currentUrl);
                });
            } else {
                fallbackCopyTextToClipboard(currentUrl);
            }
        }

        // Fallback for document copy
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('¡Enlace copiado! Listo para compartir.');
            } catch (err) {
                showToast('No se pudo copiar automáticamente', 'fa-triangle-exclamation');
            }
            document.body.removeChild(textArea);
        }

        // Sound Mute Toggle
        btnSound.addEventListener('click', () => {
            soundFX.muted = !soundFX.muted;
            if (soundFX.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-lg text-red-500';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-lg text-cyan-700';
            }
        });

        // Event Listeners for Game Controls
        btnRestart.addEventListener('click', () => {
            soundFX.init();
            initGame();
        });

        btnModalRestart.addEventListener('click', () => {
            soundFX.init();
            initGame();
        });

        btnShare.addEventListener('click', copyShareLink);
        btnModalShare.addEventListener('click', copyShareLink);

        // Start game on page load
        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });
    </script>
</body>
</html>
